[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "courtvision-racket-analytics"
version = "4.0.0"
description = "Computer vision pipeline for tennis/racket-sport video analytics."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "pandas",
    "pyyaml",
    "python-dotenv",
    # The PDF match report (BSD-3-Clause).
    "reportlab>=4",
    "scipy",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    # Checks report.json against its schema in the tests (MIT).
    "jsonschema",
    "pytest",
    "ruff",
]
local = [
    # rfdetr.assets.coco_classes is imported directly; recheck on a major upgrade.
    "rfdetr>=1.11,<2",
]
tracknet = [
    "torch",
]
roboflow = [
    "inference-sdk",
]
media = [
    "imageio-ffmpeg",
    "yt-dlp",
]
ui = [
    "imageio-ffmpeg",
    "streamlit",
    "streamlit-image-coordinates",
]
train = [
    # Experiments that train small models on extracted features (BSD-3-Clause).
    "scikit-learn",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"courtvision.analytics" = ["*.json"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.format]
# Black-compatible layout; line length and target version come from [tool.ruff].

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
