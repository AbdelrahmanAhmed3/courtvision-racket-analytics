[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "courtvision-racket-analytics"
version = "3.0.0"
description = "Computer vision pipeline for tennis/racket-sport video analytics."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "pandas",
    "pyyaml",
    "python-dotenv",
    "scipy",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
gpu = [
    "ultralytics",
]
tracknet = [
    "torch",
]
roboflow = [
    "inference-sdk",
]
media = [
    "imageio-ffmpeg",
    "yt-dlp",
]
ui = [
    "imageio-ffmpeg",
    "streamlit",
    "streamlit-image-coordinates",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.format]
# Black-compatible layout; line length and target version come from [tool.ruff].

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
