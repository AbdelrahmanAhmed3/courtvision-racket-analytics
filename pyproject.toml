[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "courtvision-racket-analytics"
version = "0.1.0"
description = "Computer vision pipeline for tennis/racket-sport video analytics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "pandas",
    "pyyaml",
    "python-dotenv",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "black",
    "pytest",
    "ruff",
]
gpu = [
    "ultralytics",
]
roboflow = [
    "inference-sdk",
]
media = [
    "imageio-ffmpeg",
    "yt-dlp",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
